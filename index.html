<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CT Monitoring</title><style>
body{margin:0;font-family:Arial;background:#f3f6fa;color:#172033}header{background:#102033;color:white;padding:16px}main{max-width:1200px;margin:auto;padding:15px}
nav{display:flex;gap:6px;background:white;padding:8px;position:sticky;top:0;z-index:2}button{padding:9px 12px;border:0;border-radius:7px;font-weight:bold}.on,.save{background:#1769e0;color:white}.card{background:white;padding:15px;border-radius:10px;margin:10px 0;box-shadow:0 3px 12px #0001}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k{font-size:24px;font-weight:bold}.muted{color:#718096;font-size:12px}input,select{width:100%;padding:10px;box-sizing:border-box;border:1px solid #dce3eb;border-radius:7px;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #e5e9ef;text-align:left;white-space:nowrap}th{background:#f8fafc;position:sticky;top:0}.scroll{overflow:auto;max-height:520px}
.page{display:none}.page.active{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.ok{color:#16844a}.ng{color:#d9363e}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header><b>DAILY REPORT CYCLE TIME</b><div class="muted" style="color:#b8c5d5">Web App • HP + PC</div></header>
<nav><button class="on" onclick="show('dash',this)">Dashboard</button><button onclick="show('input',this)">Input CT</button><button onclick="show('master',this)">Master Data</button></nav><main>
<section id="dash" class="page active"><div class="grid"><div class="card"><div class="k" id="n">0</div><div class="muted">Record</div></div><div class="card"><div class="k" id="ma">0</div><div class="muted">Mesin</div></div><div class="card"><div class="k" id="av">0</div><div class="muted">Avg CT</div></div><div class="card"><div class="k" id="ov">0</div><div class="muted">CT Over Cost</div></div></div>
<div class="card"><h3>Monitoring CT</h3><div class="scroll"><table><thead><tr><th>Tanggal</th><th>Mesin</th><th>Shift</th><th>Part No</th><th>Part Name</th><th>Model</th><th>Cost</th><th>Actual</th><th>Gap</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
<section id="input" class="page"><div class="card"><h3>Input CT</h3><div class="form">
<div><label>Tanggal<input id="date" type="date"></label></div><div><label>Mesin<select id="machine"></select></label></div>
<div><label>Shift<select id="shift"></select></label></div><div class="full"><label>Part No<input id="pn" list="plist" oninput="lookup()" placeholder="Ketik Part No"><datalist id="plist"></datalist></label><div id="msg" class="muted"></div></div>
<div><label>Part Name<input id="pname" readonly></label></div><div><label>Model<input id="model" readonly></label></div>
<div><label>CT Cost<input id="cost" readonly></label></div><div><label>Cavity<input id="cavity" readonly></label></div>
<div><label>CT Actual<input id="actual" type="number" step=".1"></label></div><div><label>Keterangan<input id="ket"></label></div>
</div><br><button class="save" onclick="saveRec()">Simpan CT</button></div></section>
<section id="master" class="page"><div class="card"><h3>Tambah Master Part</h3><div class="form"><input id="mpn" placeholder="Part No"><input id="mpname" placeholder="Part Name"><input id="mmodel" placeholder="Model"><input id="mcost" type="number" placeholder="CT Cost"><input id="mcavity" placeholder="Cavity"></div><br><button class="save" onclick="addPart()">Tambah Part</button></div>
<div class="card"><h3>Tambah Mesin / Shift</h3><div class="form"><input id="mname" placeholder="Nama Mesin, contoh A19"><input id="sname" placeholder="Shift, contoh 4"></div><br><button class="save" onclick="addMachine()">Tambah Mesin</button> <button class="save" onclick="addShift()">Tambah Shift</button></div>
<div class="card"><h3>Master Part</h3><div class="scroll"><table><thead><tr><th>Part No</th><th>Part Name</th><th>Model</th><th>CT Cost</th><th>Cavity</th></tr></thead><tbody id="pt"></tbody></table></div></div>
<div class="card"><h3>Master Mesin</h3><div id="mt"></div><h3>Master Shift</h3><div id="st"></div></div></section>
</main><script>
let M={parts:[],machines:[],shifts:[]},R=[];
const $=x=>document.getElementById(x);
async function api(u,o){let r=await fetch(u,o);let j=await r.json();if(!r.ok)throw Error(j.error||"Error");return j}
function show(id,b){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");if(id=="dash")loadRecords();if(id=="master")renderMaster()}
async function load(){M=await api("/api/master");R=await api("/api/records");fill();render();renderMaster()}
function fill(){machine.innerHTML=M.machines.map(x=>`<option>${x.name}</option>`).join("");shift.innerHTML=M.shifts.map(x=>`<option>${x.name}</option>`).join("");plist.innerHTML=M.parts.map(x=>`<option value="${x.part_no}">${x.part_name} - ${x.model}</option>`).join("");date.value=new Date().toISOString().slice(0,10)}
function lookup(){let p=M.parts.find(x=>x.part_no.toUpperCase()==pn.value.trim().toUpperCase());pname.value=p?.part_name||"";model.value=p?.model||"";cost.value=p?.ct_cost||"";cavity.value=p?.cavity||"";msg.textContent=p?"✓ Part ditemukan":"⚠ Part belum ada di Master Part";msg.className=p?"ok":"ng"}
async function saveRec(){let p=M.parts.find(x=>x.part_no.toUpperCase()==pn.value.trim().toUpperCase());if(!p)return alert("Part No belum terdaftar.");if(!actual.value)return alert("Isi CT Actual.");try{await api("/api/record",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:date.value,machine:machine.value,shift:shift.value,part_no:p.part_no,ct_actual:+actual.value,ket:ket.value})});alert("CT berhasil disimpan");pn.value=actual.value=ket.value="";lookup();R=await api("/api/records");render()}catch(e){alert(e.message)}}
function render(){n.textContent=R.length;ma.textContent=new Set(R.map(x=>x.machine)).size;let a=R.map(x=>+x.ct_actual).filter(Boolean);av.textContent=a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1)+" s":"0";ov.textContent=R.filter(x=>+x.ct_actual>+x.ct_cost).length;rows.innerHTML=R.map(x=>{let g=+x.ct_actual-+x.ct_cost,b=g>0;return `<tr><td>${x.date}</td><td>${x.machine}</td><td>${x.shift}</td><td>${x.part_no}</td><td>${x.part_name}</td><td>${x.model}</td><td>${x.ct_cost}</td><td>${x.ct_actual}</td><td class="${b?'ng':'ok'}">${g.toFixed(1)}</td><td class="${b?'ng':'ok'}">${b?'OVER':'OK'}</td></tr>`}).join("")}
async function addPart(){try{await api("/api/part",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({part_no:mpn.value,part_name:mpname.value,model:mmodel.value,ct_cost:+mcost.value,cavity:mcavity.value})});alert("Part ditambahkan");M=await api("/api/master");fill();renderMaster()}catch(e){alert(e.message)}}
async function addMachine(){try{await api("/api/machine",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:mname.value})});alert("Mesin ditambahkan");mname.value="";M=await api("/api/master");fill();renderMaster()}catch(e){alert(e.message)}}
async function addShift(){try{await api("/api/shift",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:sname.value})});alert("Shift ditambahkan");sname.value="";M=await api("/api/master");fill();renderMaster()}catch(e){alert(e.message)}}
function renderMaster(){pt.innerHTML=M.parts.map(x=>`<tr><td>${x.part_no}</td><td>${x.part_name}</td><td>${x.model}</td><td>${x.ct_cost}</td><td>${x.cavity}</td></tr>`).join("");mt.innerHTML=M.machines.map(x=>`<span style="display:inline-block;padding:7px">${x.name}</span>`).join("");st.innerHTML=M.shifts.map(x=>`<span style="display:inline-block;padding:7px">Shift ${x.name}</span>`).join("")}
load();
</script></body></html>
